name: Check

# Reusable: called by ci.yml (pull requests) and deploy.yml (main), so both run the same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Lint, format check and the domain boundary rule (biome.json).
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test

      # Synth only: the placeholder email never reaches AWS.
      - run: pnpm --filter @finance/infra synth
        env:
          BUDGET_ALERT_EMAIL: ci@example.invalid
