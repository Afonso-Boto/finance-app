name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint, format check and the domain boundary rule (biome.json).
      - run: pnpm exec biome ci .

      - run: pnpm typecheck
      - run: pnpm test
      # Enable once infra/bin/app.ts defines its first stack (cdk synth fails on an empty app).
      # - run: pnpm --filter @finance/infra synth
